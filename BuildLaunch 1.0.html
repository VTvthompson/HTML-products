<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Custom Launcher Builder</title>
  <style id="appStyles">
    :root {
      --bg: #050816;
      --fg: #ffffff;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.15);
      --card-bg: rgba(15, 23, 42, 0.9);
      --border-subtle: rgba(148, 163, 184, 0.4);
      --danger: #f97373;
      --danger-soft: rgba(248, 113, 113, 0.15);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      background: radial-gradient(circle at top, #0f172a 0, #020617 45%, #000 100%);
      color: var(--fg);
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }
    #stars {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
    }
    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: white;
      border-radius: 50%;
      opacity: 0.2;
      animation: twinkle 3s infinite ease-in-out;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.1; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.8); }
    }
    #app {
      position: relative;
      z-index: 1;
      padding: 20px;
      max-width: 1100px;
      margin: 0 auto;
    }
    #modeTabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      background: rgba(15, 23, 42, 0.8);
      padding: 6px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.4);
      backdrop-filter: blur(16px);
      width: fit-content;
    }
    #modeTabs button {
      border: none;
      background: transparent;
      color: #e5e7eb;
      padding: 8px 16px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s, color 0.2s, transform 0.1s;
    }
    #modeTabs button.active {
      background: var(--accent-soft);
      color: var(--accent);
      transform: translateY(-1px);
    }
    .view { display: none; }
    .view.active { display: block; }
    #launcherView h1,
    #builderView h1 {
      font-size: 22px;
      margin-bottom: 12px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #e5e7eb;
    }
    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 14px;
      margin-top: 10px;
    }
    .buttonBox {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 12px 14px;
      border: 1px solid var(--border-subtle);
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.7);
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      gap: 4px;
      transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease, background 0.12s ease;
    }
    .buttonBox:hover {
      transform: translateY(-3px) scale(1.01);
      box-shadow: 0 24px 60px rgba(15, 23, 42, 0.9);
      border-color: var(--accent);
      background: radial-gradient(circle at top left, rgba(56, 189, 248, 0.18), rgba(15, 23, 42, 0.95));
    }
    .buttonTitle {
      font-weight: 600;
      font-size: 15px;
      color: #f9fafb;
    }
    .buttonDesc {
      font-size: 13px;
      color: #9ca3af;
    }
    /* Mass close tile — always pinned to the end of the grid */
    .massCloseBox {
      order: 9999;
      border-color: rgba(248, 113, 113, 0.6);
      background: radial-gradient(circle at top left, var(--danger-soft), rgba(15, 23, 42, 0.95));
    }
    .massCloseBox:hover {
      border-color: var(--danger);
      background: radial-gradient(circle at top left, rgba(248, 113, 113, 0.28), rgba(15, 23, 42, 0.98));
    }
    .massCloseBox .buttonTitle { color: #fecaca; }
    /* Progress star strip — one star per grid tile */
    #progressBar {
      display: flex;
      gap: 10px;
      align-items: center;
      margin: 2px 0 6px;
      min-height: 26px;
    }
    .progressStar {
      font-size: 18px;
      line-height: 1;
      color: #4b5563;
      opacity: 0.55;
      user-select: none;
      transition: color 0.25s, opacity 0.25s, text-shadow 0.25s;
    }
    .progressStar.done {
      color: #facc15;
      opacity: 1;
      text-shadow: 0 0 8px rgba(250, 204, 21, 0.75);
    }
    .progressStar.current {
      animation: starJump 0.9s infinite ease-in-out;
    }
    @keyframes starJump {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25% { transform: translateY(-4px) rotate(-8deg); }
      50% { transform: translateY(1px) rotate(6deg); }
      75% { transform: translateY(-3px) rotate(-4deg); }
    }
    /* Master variable tiles (cyan edge) + linked tiles */
    .masterBox { border-color: rgba(56, 189, 248, 0.7); }
    /* Clipboard-mode tiles (yellow edge = value copied, not URL-combined) */
    .copyBox { border-color: rgba(250, 204, 21, 0.65); }
    .copyBox:hover {
      border-color: #facc15;
      background: radial-gradient(circle at top left, rgba(250, 204, 21, 0.14), rgba(15, 23, 42, 0.95));
    }
    .varTag {
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
    }
    .varTag.linked { color: #a5b4fc; }
    .varTag.copy { color: #facc15; }
    .varInput {
      margin-top: 6px;
      width: 100%;
      padding: 6px 8px;
      border-radius: 8px;
      border: 1px solid rgba(148, 163, 184, 0.5);
      background: rgba(2, 6, 23, 0.85);
      color: #e5e7eb;
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .varInput:focus {
      border-color: #facc15;
      box-shadow: 0 0 0 1px rgba(250, 204, 21, 0.4);
    }
    .varValue {
      font-size: 12px;
      color: #a5b4fc;
      word-break: break-all;
    }
    .previewBadge {
      align-self: flex-start;
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid rgba(250, 204, 21, 0.5);
      color: #facc15;
    }
    .previewBadge.linked {
      border-color: rgba(165, 180, 252, 0.5);
      color: #a5b4fc;
    }
    .previewBadge.copy {
      border-color: rgba(250, 204, 21, 0.5);
      color: #facc15;
    }
    #builderLayout {
      display: grid;
      grid-template-columns: minmax(260px, 320px) minmax(0, 1fr);
      gap: 16px;
      align-items: flex-start;
    }
    #builderPanel {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 14px 16px;
      border: 1px solid var(--border-subtle);
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.7);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    #builderPanel label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #9ca3af;
      margin-bottom: 2px;
    }
    #builderPanel input,
    #builderPanel select {
      width: 100%;
      padding: 7px 9px;
      border-radius: 10px;
      border: 1px solid rgba(55, 65, 81, 0.9);
      background: rgba(15, 23, 42, 0.9);
      color: #e5e7eb;
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
    }
    #builderPanel input:focus,
    #builderPanel select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.4);
      background: rgba(15, 23, 42, 1);
    }
    #builderPanel .row {
      display: flex;
      flex-direction: column;
      margin-bottom: 4px;
    }
    #builderPanel .toggleRow {
      flex-direction: row;
      align-items: center;
      gap: 8px;
    }
    #builderPanel .toggleRow input[type="checkbox"] {
      width: auto;
      accent-color: var(--accent);
      cursor: pointer;
    }
    #builderPanel .toggleRow label {
      margin-bottom: 0;
      text-transform: none;
      letter-spacing: normal;
      font-size: 13px;
      color: #e5e7eb;
      cursor: pointer;
    }
    #builderPanel .buttonsRow {
      display: flex;
      gap: 8px;
      margin-top: 6px;
    }
    #builderPanel .buttonsRow button {
      flex: 1;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.6);
      background: rgba(15, 23, 42, 0.9);
      color: #e5e7eb;
      padding: 7px 10px;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s, border-color 0.15s, transform 0.1s, box-shadow 0.15s;
      white-space: nowrap;
    }
    #builderPanel .buttonsRow button.primary {
      border-color: var(--accent);
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.18), rgba(15, 23, 42, 0.95));
      color: #e0f2fe;
    }
    #builderPanel .buttonsRow button:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 30px rgba(15, 23, 42, 0.8);
      border-color: var(--accent);
      background: radial-gradient(circle at top left, rgba(56, 189, 248, 0.2), rgba(15, 23, 42, 0.98));
    }
    #builderPreview {
      background: rgba(15, 23, 42, 0.9);
      border-radius: 16px;
      padding: 14px 16px;
      border: 1px solid var(--border-subtle);
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.7);
      min-height: 80px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    #builderPreview h2 {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #9ca3af;
    }
    #builderPreview .empty {
      font-size: 13px;
      color: #6b7280;
      font-style: italic;
    }
    /* Builder preview item controls (reorder / edit / delete) */
    .pvControls {
      position: absolute;
      top: 8px;
      right: 10px;
      display: flex;
      gap: 10px;
      z-index: 5;
    }
    .pvBtn {
      font-size: 15px;
      line-height: 1;
      color: var(--accent);
      cursor: pointer;
      user-select: none;
      text-shadow: 0 0 6px rgba(56, 189, 248, 0.8);
      transition: transform 0.1s, color 0.1s;
    }
    .pvBtn:hover {
      color: #ffffff;
      transform: scale(1.2);
      text-shadow: 0 0 12px rgba(56, 189, 248, 1);
    }
    .pvBtn.danger {
      color: var(--danger);
      text-shadow: 0 0 6px rgba(248, 113, 113, 0.6);
    }
    .pvBtn.disabled {
      opacity: 0.25;
      pointer-events: none;
    }
    .builderPreviewItem.editing {
      border-color: #facc15;
      box-shadow: 0 0 0 1px rgba(250, 204, 21, 0.4), 0 18px 40px rgba(15, 23, 42, 0.7);
    }
    .hidden { display: none !important; }
    /* Tier locking — tile needs its variable before it opens */
    .buttonBox.locked {
      opacity: 0.45;
      filter: grayscale(0.5);
      cursor: not-allowed;
    }
    .buttonBox.locked:hover {
      transform: none;
      border-color: var(--border-subtle);
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.7);
      background: var(--card-bg);
    }
    @keyframes shakeNo {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }
    .buttonBox.shake { animation: shakeNo 0.3s ease; }
    @media (max-width: 800px) {
      body { overflow-y: auto; }
      #builderLayout { grid-template-columns: minmax(0, 1fr); }
    }
  </style>
</head>
<body>

<!-- =========================================================
     CONFIG — json64. The ONLY thing that changes between
     exports. Base64-encoded JSON of user variables/buttons.
========================================================== -->
<script id="configData" type="application/json+base64">eyJidXR0b25zIjpbXSwic2V0dGluZ3MiOnsibWFzc0Nsb3NlIjp0cnVlfX0=</script>

<!-- =========================================================
     STATIC DOM — inert <template>. The browser NEVER parses,
     mutates, or "translates" template contents. The live UI
     is a clone; export reads this template verbatim.
========================================================== -->
<template id="staticDOM">
  <div id="stars"></div>
  <div id="app">
    <div id="modeTabs">
      <button data-mode="launcher" class="active">Launcher</button>
      <button data-mode="builder">Builder</button>
    </div>
    <div id="launcherView" class="view active">
      <h1>Launcher</h1>
      <div id="progressBar"></div>
      <div id="grid"></div>
    </div>
    <div id="builderView" class="view">
      <h1>Builder Mode</h1>
      <div id="builderLayout">
        <div id="builderPanel">
          <div class="row">
            <label for="btnLabel">Button Label</label>
            <input id="btnLabel" placeholder="e.g. Docs, Dashboard, Tools">
          </div>
          <div class="row">
            <label for="btnDesc">Description</label>
            <input id="btnDesc" placeholder="Optional short description">
          </div>
          <div class="row">
            <label for="btnURL">URL</label>
            <input id="btnURL" placeholder="https://example.com — use {{var}} to insert the variable">
          </div>
          <div class="row">
            <label for="btnMode">Open Mode</label>
            <select id="btnMode">
              <option value="tab">Open in New Tab</option>
              <option value="window">Open in New Window (Split-Screen Capable)</option>
            </select>
          </div>
          <div class="row">
            <label for="btnVarAction">Variable Handling</label>
            <select id="btnVarAction">
              <option value="url">Insert into URL ({{var}} or append)</option>
              <option value="copy">Copy to clipboard on open (yellow tile)</option>
            </select>
          </div>
          <div class="row toggleRow">
            <input type="checkbox" id="optMaster">
            <label for="optMaster">Master variable (label becomes the variable name)</label>
          </div>
          <div class="row">
            <label for="btnUsesVar">Uses Master Variable</label>
            <select id="btnUsesVar">
              <option value="">None</option>
            </select>
          </div>
          <div class="row toggleRow">
            <input type="checkbox" id="optMassClose">
            <label for="optMassClose">"Close All" tile (always last in grid)</label>
          </div>
          <div class="buttonsRow">
            <button id="addButton" class="primary">Add Button</button>
            <button id="cancelEdit" class="hidden">Cancel</button>
            <button id="exportSelf">Export New Launcher</button>
          </div>
        </div>
        <div id="builderPreview">
          <h2>Preview</h2>
        </div>
      </div>
    </div>
  </div>
</template>

<!-- Live UI mounts here (clone of staticDOM) -->
<div id="mount"></div>

<script id="launcherCode">
"use strict";
// =========================================================
// BOOT — clone the static DOM template into the live mount.
// Everything below only ever touches the CLONE. The template
// stays pristine and is the sole export source for markup.
// =========================================================
(function boot() {
  var tpl = document.getElementById("staticDOM");
  document.getElementById("mount").appendChild(tpl.content.cloneNode(true));
})();

// =========================================================
// CONFIG (json64) — decode once at boot, encode on export
// =========================================================
function b64encode(str) {
  return btoa(unescape(encodeURIComponent(str)));
}
function b64decode(str) {
  return decodeURIComponent(escape(atob(str)));
}
var DEFAULT_CONFIG = { title: "", buttons: [], settings: { massClose: true } };
function loadConfig() {
  var el = document.getElementById("configData");
  if (!el || !el.textContent.trim()) return JSON.parse(JSON.stringify(DEFAULT_CONFIG));
  try {
    var cfg = JSON.parse(b64decode(el.textContent.trim()));
    return {
      title: typeof cfg.title === "string" ? cfg.title : "",
      buttons: Array.isArray(cfg.buttons) ? cfg.buttons : [],
      settings: Object.assign({}, DEFAULT_CONFIG.settings, cfg.settings || {})
    };
  } catch (e) {
    console.warn("configData corrupt, falling back to defaults:", e);
    return JSON.parse(JSON.stringify(DEFAULT_CONFIG));
  }
}
var config = loadConfig();

// =========================================================
// RUNTIME WORKFLOW STATE (never exported — resets each run)
// =========================================================
var varValues = {};     // shared variable values, keyed by master label
var localVals = {};     // per-tile values for tiles with no shared variable
var openedSteps = {};   // button index -> true once opened
var currentStep = -1;   // last opened step (its star jumps)

function resetWorkflow() {
  varValues = {};
  localVals = {};
  openedSteps = {};
  currentStep = -1;
}

// Which variable does this button read? Masters read their own label.
function varNameFor(btn) {
  return btn.isMaster ? btn.label : (btn.usesVar || "");
}

// Current value for a tile: shared variable if linked, else its own
function valueFor(btn, index) {
  var name = varNameFor(btn);
  return name ? (varValues[name] || "") : (localVals[index] || "");
}

// Substitute variable into URL: {{var}} placeholder if present,
// otherwise append the encoded value (search-prefix pattern).
// Clipboard-mode tiles never modify their URL.
function resolveURL(btn, index) {
  if ((btn.varAction || "url") === "copy") return btn.url;
  var val = valueFor(btn, index);
  if (btn.url.indexOf("{{var}}") !== -1) {
    return btn.url.split("{{var}}").join(encodeURIComponent(val));
  }
  return val ? btn.url + encodeURIComponent(val) : btn.url;
}

// Set a shared variable: sync every tile input bound to it, and
// lock/unlock gated tiles (tiered workflow: a step cannot open
// until its required variable is obtained).
function setVar(name, value, sourceEl) {
  varValues[name] = value;
  document.querySelectorAll('[data-var-input="' + name + '"]').forEach(function (el) {
    if (el !== sourceEl) el.value = value;
  });
  var has = !!value;
  document.querySelectorAll('[data-lock-var="' + name + '"]').forEach(function (el) {
    el.classList.toggle("locked", !has);
  });
}

// Clipboard support for sites whose URLs can't carry the variable
function legacyCopy(text) {
  var ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); } catch (e) {}
  document.body.removeChild(ta);
}
function copyToClipboard(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).catch(function () { legacyCopy(text); });
  } else {
    legacyCopy(text);
  }
}

// =========================================================
// PROGRESS STARS — grey/static until a tile is opened, then
// yellow; the current step's star jumps around
// =========================================================
function renderProgress() {
  var bar = document.getElementById("progressBar");
  if (!bar) return;
  bar.innerHTML = "";
  config.buttons.forEach(function (btn, i) {
    var s = document.createElement("span");
    s.className = "progressStar";
    s.textContent = "★";
    s.title = "Step " + (i + 1) + ": " + (btn.label || "");
    if (openedSteps[i]) s.classList.add("done");
    if (i === currentStep) s.classList.add("current");
    bar.appendChild(s);
  });
}

// =========================================================
// WINDOW TRACKING + MASS CLOSE
// =========================================================
var openedWindows = [];
function openTracked(url, features) {
  var w = features ? window.open(url, "_blank", features) : window.open(url, "_blank");
  if (w) openedWindows.push(w);
  return w;
}
function closeAllWindows() {
  var n = 0;
  while (openedWindows.length) {
    var w = openedWindows.pop();
    if (w && !w.closed) { w.close(); n++; }
  }
  return n;
}

// =========================================================
// STARFIELD
// =========================================================
(function starfield() {
  var starsContainer = document.getElementById("stars");
  for (var i = 0; i < 200; i++) {
    var s = document.createElement("div");
    s.className = "star";
    s.style.top = Math.random() * 100 + "%";
    s.style.left = Math.random() * 100 + "%";
    s.style.animationDelay = Math.random() * 3 + "s";
    starsContainer.appendChild(s);
  }
})();

// =========================================================
// MODE SWITCHING
// =========================================================
document.querySelectorAll("#modeTabs button").forEach(function (btn) {
  btn.addEventListener("click", function () {
    var mode = btn.getAttribute("data-mode");
    document.querySelectorAll("#modeTabs button").forEach(function (b) { b.classList.remove("active"); });
    btn.classList.add("active");
    document.querySelectorAll(".view").forEach(function (v) { v.classList.remove("active"); });
    var view = document.getElementById(mode + "View");
    if (view) view.classList.add("active");
  });
});

// =========================================================
// RENDER LAUNCHER (mass close tile always appended LAST,
// plus CSS order:9999 as a hard guarantee)
// =========================================================
function renderLauncher() {
  var grid = document.getElementById("grid");
  if (!grid) return;
  grid.innerHTML = "";

  if (!config.buttons.length) {
    var empty = document.createElement("div");
    empty.className = "buttonBox";
    var emptyTitle = document.createElement("div");
    emptyTitle.className = "buttonTitle";
    emptyTitle.textContent = "No buttons yet";
    var emptyDesc = document.createElement("div");
    emptyDesc.className = "buttonDesc";
    emptyDesc.textContent = "Use the Builder tab to add some.";
    empty.appendChild(emptyTitle);
    empty.appendChild(emptyDesc);
    grid.appendChild(empty);
  } else {
    config.buttons.forEach(function (btn, index) {
      var isCopy = (btn.varAction || "url") === "copy";
      var a = document.createElement("a");
      a.className = "buttonBox"
        + (btn.isMaster ? " masterBox" : "")
        + (isCopy ? " copyBox" : "");
      a.href = btn.url;
      var vname = varNameFor(btn);

      if (btn.isMaster) {
        var tag = document.createElement("div");
        tag.className = "varTag";
        tag.textContent = "★ master · " + btn.label;
        a.appendChild(tag);
      } else if (btn.usesVar) {
        var ltag = document.createElement("div");
        ltag.className = "varTag linked";
        ltag.textContent = "⛓ uses · " + btn.usesVar;
        a.appendChild(ltag);
      }
      if (isCopy) {
        var ctag = document.createElement("div");
        ctag.className = "varTag copy";
        ctag.textContent = "📋 copies to clipboard";
        a.appendChild(ctag);
      }

      var btnTitle = document.createElement("div");
      btnTitle.className = "buttonTitle";
      btnTitle.textContent = btn.label || "";
      var btnDesc = document.createElement("div");
      btnDesc.className = "buttonDesc";
      btnDesc.textContent = btn.desc || "";
      a.appendChild(btnTitle);
      a.appendChild(btnDesc);

      // Every tile has an input slot for the variable it needs.
      // Linked/master inputs share one value and sync live; the
      // rest keep a tile-local value.
      var input = document.createElement("input");
      input.className = "varInput";
      input.type = "text";
      if (vname) {
        input.placeholder = "Enter " + vname + "…";
        input.value = varValues[vname] || "";
        input.setAttribute("data-var-input", vname);
        input.addEventListener("input", function () {
          setVar(vname, input.value.trim(), input);
        });
      } else {
        input.placeholder = isCopy ? "Value to copy…" : "Optional value…";
        input.value = localVals[index] || "";
        input.addEventListener("input", function () {
          localVals[index] = input.value.trim();
        });
      }
      input.addEventListener("click", function (e) { e.preventDefault(); e.stopPropagation(); });
      a.appendChild(input);

      // Tier gate: linked tiles stay locked until the variable exists
      if (!btn.isMaster && btn.usesVar) {
        a.setAttribute("data-lock-var", btn.usesVar);
        if (!varValues[btn.usesVar]) a.classList.add("locked");
      }

      a.addEventListener("click", function (e) {
        e.preventDefault();
        if (a.classList.contains("locked")) {
          a.classList.add("shake");
          setTimeout(function () { a.classList.remove("shake"); }, 350);
          return;
        }
        var val = valueFor(btn, index);
        if (isCopy && val) {
          copyToClipboard(val);
          var prevDesc = btnDesc.textContent;
          btnDesc.textContent = "📋 Copied — paste it inside the site";
          setTimeout(function () { btnDesc.textContent = prevDesc; }, 2500);
        }
        var url = resolveURL(btn, index);
        var mode = btn.mode || "tab";
        if (mode === "window") {
          var w = Math.floor(window.screen.width / 2);
          var h = window.screen.height;
          var left = window.screen.width - w;
          openTracked(url, "popup,width=" + w + ",height=" + h + ",left=" + left + ",top=0");
        } else {
          openTracked(url);
        }
        openedSteps[index] = true;
        currentStep = index;
        renderProgress();
      });
      grid.appendChild(a);
    });
  }

  // Mass close tile — appended after every button, every render
  if (config.settings.massClose) {
    var mc = document.createElement("div");
    mc.className = "buttonBox massCloseBox";
    var mcTitle = document.createElement("div");
    mcTitle.className = "buttonTitle";
    mcTitle.textContent = "✕ Close All";
    var mcDesc = document.createElement("div");
    mcDesc.className = "buttonDesc";
    mcDesc.textContent = "Close all opened windows & reset the workflow";
    mc.appendChild(mcTitle);
    mc.appendChild(mcDesc);
    mc.addEventListener("click", function () {
      closeAllWindows();
      resetWorkflow();           // stars back to grey, variables cleared
      renderLauncher();
      renderProgress();
    });
    grid.appendChild(mc);
  }
}

// =========================================================
// RENDER BUILDER PREVIEW (neon delete icons)
// =========================================================
var editIndex = -1;

function masterNameSet() {
  var m = {};
  config.buttons.forEach(function (b) { if (b.isMaster && b.label) m[b.label] = true; });
  return m;
}

// Clear usesVar links that point at a master that no longer exists
function scrubLinks() {
  var m = masterNameSet();
  config.buttons.forEach(function (b) {
    if (b.usesVar && !m[b.usesVar]) b.usesVar = "";
  });
}

function clearBuilderForm() {
  document.getElementById("btnLabel").value = "";
  document.getElementById("btnDesc").value = "";
  document.getElementById("btnURL").value = "";
  document.getElementById("btnMode").value = "tab";
  document.getElementById("btnVarAction").value = "url";
  document.getElementById("optMaster").checked = false;
  var sel = document.getElementById("btnUsesVar");
  sel.value = "";
  sel.disabled = false;
}

function exitEditMode() {
  editIndex = -1;
  clearBuilderForm();
  document.getElementById("addButton").textContent = "Add Button";
  document.getElementById("cancelEdit").classList.add("hidden");
}

function startEdit(index) {
  var b = config.buttons[index];
  editIndex = index;
  refreshVarSelect();
  document.getElementById("btnLabel").value = b.label || "";
  document.getElementById("btnDesc").value = b.desc || "";
  document.getElementById("btnURL").value = b.url || "";
  document.getElementById("btnMode").value = b.mode || "tab";
  document.getElementById("btnVarAction").value = b.varAction || "url";
  var m = document.getElementById("optMaster");
  var sel = document.getElementById("btnUsesVar");
  m.checked = !!b.isMaster;
  sel.disabled = !!b.isMaster;
  sel.value = b.usesVar || "";
  document.getElementById("addButton").textContent = "Save Changes";
  document.getElementById("cancelEdit").classList.remove("hidden");
  renderBuilderPreview();
}

function moveButton(index, dir) {
  var target = index + dir;
  if (target < 0 || target >= config.buttons.length) return;
  if (editIndex >= 0) exitEditMode();
  var tmp = config.buttons[index];
  config.buttons[index] = config.buttons[target];
  config.buttons[target] = tmp;
  resetWorkflow();               // sequence changed — restart progress
  renderLauncher();
  renderProgress();
  renderBuilderPreview();
}

function deleteButton(index) {
  config.buttons.splice(index, 1);
  scrubLinks();
  if (editIndex >= 0) exitEditMode();
  resetWorkflow();               // indices shifted — restart progress
  refreshVarSelect();
  renderLauncher();
  renderProgress();
  renderBuilderPreview();
}

// Keep the "Uses Master Variable" dropdown in sync with the
// master buttons currently defined (label = variable name).
function refreshVarSelect() {
  var sel = document.getElementById("btnUsesVar");
  if (!sel) return;
  var prev = sel.value;
  sel.innerHTML = "";
  var none = document.createElement("option");
  none.value = "";
  none.textContent = "None";
  sel.appendChild(none);
  var seen = {};
  config.buttons.forEach(function (b) {
    if (b.isMaster && b.label && !seen[b.label]) {
      seen[b.label] = true;
      var o = document.createElement("option");
      o.value = b.label;
      o.textContent = b.label;
      sel.appendChild(o);
    }
  });
  sel.value = prev;
  if (sel.value !== prev) sel.value = "";
}
function renderBuilderPreview() {
  var preview = document.getElementById("builderPreview");
  if (!preview) return;
  preview.innerHTML = "";
  var previewTitle = document.createElement("h2");
  previewTitle.textContent = "Preview";
  preview.appendChild(previewTitle);
  if (!config.buttons.length) {
    var empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "No buttons yet. Add one on the left.";
    preview.appendChild(empty);
    return;
  }
  config.buttons.forEach(function (btn, index) {
    var box = document.createElement("div");
    box.className = "buttonBox builderPreviewItem";
    box.style.position = "relative";
    var title = document.createElement("div");
    title.className = "buttonTitle";
    title.textContent = btn.label || "";
    var desc = document.createElement("div");
    desc.className = "buttonDesc";
    desc.textContent = btn.desc || "";
    var badge = null;
    if (btn.isMaster) {
      badge = document.createElement("div");
      badge.className = "previewBadge";
      badge.textContent = "★ master: " + btn.label;
    } else if (btn.usesVar) {
      badge = document.createElement("div");
      badge.className = "previewBadge linked";
      badge.textContent = "⛓ uses: " + btn.usesVar;
    }
    var copyBadge = null;
    if ((btn.varAction || "url") === "copy") {
      copyBadge = document.createElement("div");
      copyBadge.className = "previewBadge copy";
      copyBadge.textContent = "📋 clipboard";
    }
    var controls = document.createElement("div");
    controls.className = "pvControls";
    var up = document.createElement("span");
    up.className = "pvBtn" + (index === 0 ? " disabled" : "");
    up.textContent = "▲";
    up.title = "Move up";
    up.onclick = function () { moveButton(index, -1); };
    var down = document.createElement("span");
    down.className = "pvBtn" + (index === config.buttons.length - 1 ? " disabled" : "");
    down.textContent = "▼";
    down.title = "Move down";
    down.onclick = function () { moveButton(index, 1); };
    var edit = document.createElement("span");
    edit.className = "pvBtn";
    edit.textContent = "✎";
    edit.title = "Edit";
    edit.onclick = function () { startEdit(index); };
    var del = document.createElement("span");
    del.className = "pvBtn danger";
    del.textContent = "✕";
    del.title = "Delete";
    del.onclick = function () { deleteButton(index); };
    controls.appendChild(up);
    controls.appendChild(down);
    controls.appendChild(edit);
    controls.appendChild(del);
    if (index === editIndex) box.classList.add("editing");
    box.appendChild(title);
    box.appendChild(desc);
    if (badge) box.appendChild(badge);
    if (copyBadge) box.appendChild(copyBadge);
    box.appendChild(controls);
    preview.appendChild(box);
  });
}

// =========================================================
// BUILDER CONTROLS
// =========================================================
document.getElementById("addButton").addEventListener("click", function () {
  var label = document.getElementById("btnLabel").value.trim();
  var desc = document.getElementById("btnDesc").value.trim();
  var url = document.getElementById("btnURL").value.trim();
  var mode = document.getElementById("btnMode").value;
  var varAction = document.getElementById("btnVarAction").value;
  var isMaster = document.getElementById("optMaster").checked;
  var usesVar = isMaster ? "" : document.getElementById("btnUsesVar").value;
  if (!label || !url) {
    alert("Label and URL are required.");
    return;
  }
  var entry = {
    label: label,
    desc: desc,
    url: url,
    mode: mode,
    varAction: varAction,
    isMaster: isMaster,
    usesVar: usesVar
  };
  if (editIndex >= 0) {
    var old = config.buttons[editIndex];
    // Renaming a master relinks every dependent button to the new name
    if (old.isMaster && isMaster && old.label !== label) {
      config.buttons.forEach(function (b) {
        if (b.usesVar === old.label) b.usesVar = label;
      });
    }
    config.buttons[editIndex] = entry;
    scrubLinks();
    resetWorkflow();
    exitEditMode();
  } else {
    config.buttons.push(entry);
    clearBuilderForm();
  }
  refreshVarSelect();
  renderLauncher();
  renderProgress();
  renderBuilderPreview();
});

document.getElementById("cancelEdit").addEventListener("click", function () {
  exitEditMode();
  renderBuilderPreview();
});

// Master and "uses variable" are mutually exclusive per button
document.getElementById("optMaster").addEventListener("change", function () {
  var sel = document.getElementById("btnUsesVar");
  sel.disabled = this.checked;
  if (this.checked) sel.value = "";
});

var massCloseToggle = document.getElementById("optMassClose");
massCloseToggle.checked = !!config.settings.massClose;
massCloseToggle.addEventListener("change", function () {
  config.settings.massClose = massCloseToggle.checked;
  renderLauncher();
});

// =========================================================
// EXPORTER — reconstructs the document from STATIC sources
// only: the CSS text, the inert template markup, this script
// tag's own source text, and freshly encoded json64 config.
// Zero reads of the live/rendered DOM. Exports re-export
// cleanly forever (same structure, same ids).
// =========================================================
function exportLauncher() {
  var suggested = config.title || "Custom Launcher";
  var title = prompt("Title for the exported launcher:", suggested);
  if (title === null) return; // user cancelled export
  title = title.trim() || suggested;
  config.title = title;       // rides in json64, default for next export

  var css = document.getElementById("appStyles").textContent;
  var js = document.getElementById("launcherCode").textContent;
  var staticHTML = document.getElementById("staticDOM").innerHTML;
  var cfg64 = b64encode(JSON.stringify(config));
  var safeTitle = title.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

  var html =
    "<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"UTF-8\">\n" +
    "<title>" + safeTitle + "</title>\n" +
    "<style id=\"appStyles\">" + css + "</style>\n" +
    "</head>\n<body>\n" +
    "<script id=\"configData\" type=\"application/json+base64\">" + cfg64 + "</scr" + "ipt>\n" +
    "<template id=\"staticDOM\">" + staticHTML + "</template>\n" +
    "<div id=\"mount\"></div>\n" +
    "<script id=\"launcherCode\">" + js + "</scr" + "ipt>\n" +
    "</body>\n</html>\n";

  var blob = new Blob([html], { type: "text/html" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  var fname = title.replace(/[^\w\- ]+/g, "").trim().replace(/\s+/g, "-");
  a.download = (fname || "launcher") + ".html";
  a.click();
  URL.revokeObjectURL(url);
}
document.getElementById("exportSelf").addEventListener("click", exportLauncher);

// =========================================================
// INITIAL RENDER
// =========================================================
refreshVarSelect();
renderLauncher();
renderProgress();
renderBuilderPreview();
</script>
</body>
