<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Custom Launcher Builder</title>
  <style id="appStyles">
    :root {
      color-scheme: dark;
      --fg: #ffffff;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.15);
      --card-bg: rgba(15, 23, 42, 0.9);
      --border-subtle: rgba(148, 163, 184, 0.4);
      --danger: #f97373;
      --danger-soft: rgba(248, 113, 113, 0.15);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      background: radial-gradient(circle at top, #0f172a 0, #020617 45%, #000 100%);
      color: var(--fg);
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }
    #stars {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
    }
    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: white;
      border-radius: 50%;
      opacity: 0.2;
      animation: twinkle 3s infinite ease-in-out;
    }
    /* Named constellation stars — brightness mapped from real magnitude */
    .star.bright {
      background: #dbeafe;
      box-shadow: 0 0 6px rgba(191, 219, 254, 0.8);
    }
    #stars .cstLines {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .cstLines line {
      stroke: rgba(148, 197, 253, 0.16);
      stroke-width: 1;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.1; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.8); }
    }
    #app {
      position: relative;
      z-index: 1;
      padding: 20px;
      max-width: 1100px;
      margin: 0 auto;
    }
    #modeTabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      background: rgba(15, 23, 42, 0.8);
      padding: 6px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.4);
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px);
      width: fit-content;
    }
    #modeTabs button {
      border: none;
      background: transparent;
      color: #e5e7eb;
      padding: 8px 16px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s, color 0.2s, transform 0.1s;
    }
    #modeTabs button.active {
      background: var(--accent-soft);
      color: var(--accent);
      transform: translateY(-1px);
    }
    .view { display: none; }
    .view.active { display: block; }
    #launcherView h1,
    #builderView h1 {
      font-size: 22px;
      margin-bottom: 12px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #e5e7eb;
    }
    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 14px;
      margin-top: 10px;
      max-height: calc(100vh - 220px);
      max-height: calc(100dvh - 220px);
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: thin;
      scrollbar-color: #38bdf8 rgba(15, 23, 42, 0.5);
    }
    .buttonBox {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 12px 14px;
      border: 1px solid var(--border-subtle);
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.7);
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
      overflow-wrap: anywhere;
      transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease, background 0.12s ease;
    }
    .buttonBox:hover {
      transform: translateY(-3px) scale(1.01);
      box-shadow: 0 24px 60px rgba(15, 23, 42, 0.9);
      border-color: var(--accent);
      background: radial-gradient(circle at top left, rgba(56, 189, 248, 0.18), rgba(15, 23, 42, 0.95));
    }
    .buttonTitle {
      font-weight: 600;
      font-size: 15px;
      color: #f9fafb;
    }
    .buttonDesc {
      font-size: 13px;
      color: #9ca3af;
    }
    /* Empty-state tile — informational, not clickable */
    .emptyBox { cursor: default; }
    .emptyBox:hover {
      transform: none;
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.7);
      border-color: var(--border-subtle);
      background: var(--card-bg);
    }
    /* Mass close tile — always pinned to the end of the grid */
    .massCloseBox {
      order: 9999;
      border-color: rgba(248, 113, 113, 0.6);
      background: radial-gradient(circle at top left, var(--danger-soft), rgba(15, 23, 42, 0.95));
    }
    .massCloseBox:hover {
      border-color: var(--danger);
      background: radial-gradient(circle at top left, rgba(248, 113, 113, 0.28), rgba(15, 23, 42, 0.98));
    }
    .massCloseBox .buttonTitle { color: #fecaca; }
    /* Progress star strip — one star per grid tile */
    #progressBar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin: 2px 0 6px;
      min-height: 26px;
    }
    .progressStar {
      font-size: 18px;
      line-height: 1;
      color: #4b5563;
      opacity: 0.55;
      user-select: none;
      transition: color 0.25s, opacity 0.25s, text-shadow 0.25s;
    }
    .progressStar.done {
      color: #facc15;
      opacity: 1;
      text-shadow: 0 0 8px rgba(250, 204, 21, 0.75);
    }
    .progressStar.current {
      animation: starJump 0.9s infinite ease-in-out;
    }
    @keyframes starJump {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25% { transform: translateY(-4px) rotate(-8deg); }
      50% { transform: translateY(1px) rotate(6deg); }
      75% { transform: translateY(-3px) rotate(-4deg); }
    }
    /* Stars mode control (On / Frozen / Off) */
    #starsCtl {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin: 0 0 10px;
    }
    #starsCtlLabel {
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #9ca3af;
    }
    #starsCtl button {
      border: 1px solid rgba(148, 163, 184, 0.5);
      background: rgba(15, 23, 42, 0.9);
      color: #9ca3af;
      border-radius: 999px;
      padding: 3px 10px;
      font-size: 11px;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
    }
    #starsCtl button.active {
      color: var(--accent);
      border-color: var(--accent);
      background: var(--accent-soft);
    }
    #starsNote {
      flex-basis: 100%;
      font-size: 11px;
      color: #6b7280;
    }
    body.starsFrozen .star { animation: none; opacity: 0.35; }
    body.starsFrozen .star.bright { opacity: 0.6; }
    body.starsOff #stars { display: none; }
    /* Master variable tiles (cyan edge) + linked tiles */
    .masterBox { border-color: rgba(56, 189, 248, 0.7); }
    /* Clipboard-mode tiles (yellow edge = value copied, not URL-combined) */
    .copyBox { border-color: rgba(250, 204, 21, 0.65); }
    .copyBox:hover {
      border-color: #facc15;
      background: radial-gradient(circle at top left, rgba(250, 204, 21, 0.14), rgba(15, 23, 42, 0.95));
    }
    .varTag {
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
    }
    .varTag.linked { color: #a5b4fc; }
    .varTag.copy { color: #facc15; }
    .varInput {
      margin-top: 6px;
      width: 100%;
      padding: 6px 8px;
      border-radius: 8px;
      border: 1px solid rgba(148, 163, 184, 0.5);
      background: rgba(2, 6, 23, 0.85);
      color: #e5e7eb;
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .varInput:focus {
      border-color: #facc15;
      box-shadow: 0 0 0 1px rgba(250, 204, 21, 0.4);
    }
    .previewBadge {
      align-self: flex-start;
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid rgba(250, 204, 21, 0.5);
      color: #facc15;
    }
    .previewBadge.linked {
      border-color: rgba(165, 180, 252, 0.5);
      color: #a5b4fc;
    }
    .previewBadge.copy {
      border-color: rgba(250, 204, 21, 0.5);
      color: #facc15;
    }
    #builderLayout {
      display: grid;
      grid-template-columns: minmax(260px, 320px) minmax(0, 1fr);
      gap: 16px;
      align-items: flex-start;
    }
    #builderPanel {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 14px 16px;
      border: 1px solid var(--border-subtle);
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.7);
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: calc(100vh - 160px);
      max-height: calc(100dvh - 160px);
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: thin;
      scrollbar-color: #38bdf8 rgba(15, 23, 42, 0.5);
    }
    #builderPanel label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #9ca3af;
      margin-bottom: 2px;
    }
    #builderPanel input,
    #builderPanel select {
      width: 100%;
      padding: 7px 9px;
      border-radius: 10px;
      border: 1px solid rgba(55, 65, 81, 0.9);
      background: rgba(15, 23, 42, 0.9);
      color: #e5e7eb;
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
    }
    #builderPanel input:focus,
    #builderPanel select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.4);
      background: rgba(15, 23, 42, 1);
    }
    #builderPanel .row {
      display: flex;
      flex-direction: column;
      margin-bottom: 4px;
    }
    #builderPanel .toggleRow {
      flex-direction: row;
      align-items: center;
      gap: 8px;
    }
    #builderPanel .toggleRow input[type="checkbox"] {
      width: auto;
      accent-color: var(--accent);
      cursor: pointer;
    }
    #builderPanel .toggleRow label {
      margin-bottom: 0;
      text-transform: none;
      letter-spacing: normal;
      font-size: 13px;
      color: #e5e7eb;
      cursor: pointer;
    }
    #builderPanel .buttonsRow {
      display: flex;
      gap: 8px;
      margin-top: 6px;
    }
    #builderPanel .buttonsRow button {
      flex: 1;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.6);
      background: rgba(15, 23, 42, 0.9);
      color: #e5e7eb;
      padding: 7px 10px;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s, border-color 0.15s, transform 0.1s, box-shadow 0.15s;
      white-space: nowrap;
    }
    #builderPanel .buttonsRow button.primary {
      border-color: var(--accent);
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.18), rgba(15, 23, 42, 0.95));
      color: #e0f2fe;
    }
    #builderPanel .buttonsRow button:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 30px rgba(15, 23, 42, 0.8);
      border-color: var(--accent);
      background: radial-gradient(circle at top left, rgba(56, 189, 248, 0.2), rgba(15, 23, 42, 0.98));
    }
    #builderPreview {
      background: rgba(15, 23, 42, 0.9);
      border-radius: 16px;
      padding: 14px 16px;
      border: 1px solid var(--border-subtle);
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.7);
      min-height: 80px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 70vh;
      max-height: 70dvh;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: thin;
      scrollbar-color: #38bdf8 rgba(15, 23, 42, 0.5);
    }
    #builderPreview h2 {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #9ca3af;
    }
    #builderPreview .empty {
      font-size: 13px;
      color: #6b7280;
      font-style: italic;
    }
    /* Builder preview item controls (reorder / edit / delete) */
    .pvControls {
      position: absolute;
      top: 8px;
      right: 10px;
      display: flex;
      gap: 10px;
      z-index: 5;
    }
    .pvBtn {
      background: none;
      border: none;
      padding: 0;
      font-size: 15px;
      line-height: 1;
      color: var(--accent);
      cursor: pointer;
      user-select: none;
      text-shadow: 0 0 6px rgba(56, 189, 248, 0.8);
      transition: transform 0.1s, color 0.1s;
    }
    .pvBtn:hover {
      color: #ffffff;
      transform: scale(1.2);
      text-shadow: 0 0 12px rgba(56, 189, 248, 1);
    }
    .pvBtn.danger {
      color: var(--danger);
      text-shadow: 0 0 6px rgba(248, 113, 113, 0.6);
    }
    .pvBtn.disabled {
      opacity: 0.25;
      pointer-events: none;
    }
    .builderPreviewItem.editing {
      border-color: #facc15;
      box-shadow: 0 0 0 1px rgba(250, 204, 21, 0.4), 0 18px 40px rgba(15, 23, 42, 0.7);
    }
    /* Drag & drop reorder — arrows stay as the keyboard/precision path */
    .builderPreviewItem { cursor: grab; }
    .builderPreviewItem:active { cursor: grabbing; }
    .builderPreviewItem.dragging { opacity: 0.45; }
    .builderPreviewItem.dropBefore {
      box-shadow: 0 -8px 0 -4px var(--accent), 0 18px 40px rgba(15, 23, 42, 0.7);
    }
    .builderPreviewItem.dropAfter {
      box-shadow: 0 8px 0 -4px var(--accent), 0 18px 40px rgba(15, 23, 42, 0.7);
    }
    .hidden { display: none !important; }
    /* Tier locking — tile needs its variable before it opens.
       Content dims but the input stays vivid: it IS the unlock. */
    .buttonBox.locked {
      cursor: not-allowed;
      border-style: dashed;
    }
    .buttonBox.locked .buttonTitle,
    .buttonBox.locked .buttonDesc,
    .buttonBox.locked .varTag {
      opacity: 0.4;
    }
    .buttonBox.locked:hover {
      transform: none;
      border-color: var(--border-subtle);
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.7);
      background: var(--card-bg);
    }
    .buttonBox.locked .varInput {
      border-color: rgba(250, 204, 21, 0.7);
      box-shadow: 0 0 0 1px rgba(250, 204, 21, 0.25);
      cursor: text;
    }
    @keyframes shakeNo {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }
    .buttonBox.shake { animation: shakeNo 0.3s ease; }
    #builderPreview .builderPreviewItem { flex-shrink: 0; }
    /* WebKit scrollbar fallback for Chromium <121 — Chrome 121+ uses the
       standard scrollbar-width/scrollbar-color properties above and
       ignores these rules */
    #grid::-webkit-scrollbar,
    #builderPanel::-webkit-scrollbar,
    #builderPreview::-webkit-scrollbar { width: 10px; }
    #grid::-webkit-scrollbar-track,
    #builderPanel::-webkit-scrollbar-track,
    #builderPreview::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.5);
      border-radius: 5px;
    }
    #grid::-webkit-scrollbar-thumb,
    #builderPanel::-webkit-scrollbar-thumb,
    #builderPreview::-webkit-scrollbar-thumb {
      background: #38bdf8;
      border-radius: 5px;
    }
    @media (max-width: 800px) {
      body { overflow-y: auto; }
      #builderLayout { grid-template-columns: minmax(0, 1fr); }
      /* one natural page scroll on small screens, not nested scrollers */
      #grid, #builderPanel, #builderPreview { max-height: none; }
    }
    /* Respect OS "reduce motion" for the progress star (static glow
       instead of jumping). The starfield itself is handled by the
       Stars control — OS setting only picks its DEFAULT, so an
       explicit "On" choice still wins. */
    @media (prefers-reduced-motion: reduce) {
      .progressStar.current {
        animation: none;
        color: var(--accent);
        text-shadow: 0 0 8px rgba(56, 189, 248, 0.9);
      }
    }
  </style>
</head>
<body>
<!-- =========================================================
     CONFIG — json64. The ONLY thing that changes between
     exports. Base64-encoded JSON of user variables/buttons.
========================================================== -->
<script id="configData" type="application/json+base64">eyJidXR0b25zIjpbXSwic2V0dGluZ3MiOnsibWFzc0Nsb3NlIjp0cnVlfX0=</script>
<!-- =========================================================
     STATIC DOM — inert <template>. The browser NEVER parses,
     mutates, or "translates" template contents. The live UI
     is a clone; export reads this template verbatim.
========================================================== -->
<template id="staticDOM">
  <div id="stars"></div>
  <div id="app">
    <div id="modeTabs">
      <button data-mode="launcher" class="active">Launcher</button>
      <button data-mode="builder">Builder</button>
    </div>
    <div id="launcherView" class="view active">
      <h1>Launcher</h1>
      <div id="starsCtl">
        <span id="starsCtlLabel">Stars</span>
        <button type="button" data-stars="on">On</button>
        <button type="button" data-stars="frozen">Frozen</button>
        <button type="button" data-stars="off">Off</button>
        <span id="starsNote">Moving stars can aggravate migraines, inner-ear (vestibular) disorders, and concussion recovery. If that's you, use Frozen or Off.</span>
      </div>
      <div id="progressBar"></div>
      <div id="grid"></div>
    </div>
    <div id="builderView" class="view">
      <h1>Builder Mode</h1>
      <div id="builderLayout">
        <div id="builderPanel">
          <div class="row">
            <label for="btnLabel">Button Label</label>
            <input id="btnLabel" placeholder="e.g. Docs, Dashboard, Tools">
          </div>
          <div class="row">
            <label for="btnDesc">Description</label>
            <input id="btnDesc" placeholder="Optional short description">
          </div>
          <div class="row">
            <label for="btnURL">URL</label>
            <input id="btnURL" placeholder="https://example.com — use {{var}} to insert the variable">
          </div>
          <div class="row">
            <label for="btnMode">Open Mode</label>
            <select id="btnMode">
              <option value="tab">Open in New Tab</option>
              <option value="window">Open in New Window (Split-Screen Capable)</option>
            </select>
          </div>
          <div class="row">
            <label for="btnVarAction">Variable Handling</label>
            <select id="btnVarAction">
              <option value="url">Insert into URL ({{var}} or append)</option>
              <option value="copy">Copy to clipboard on open (yellow tile)</option>
            </select>
          </div>
          <div class="row toggleRow">
            <input type="checkbox" id="optMaster">
            <label for="optMaster">Master variable (label becomes the variable name)</label>
          </div>
          <div class="row">
            <label for="btnUsesVar">Uses Master Variable</label>
            <select id="btnUsesVar">
              <option value="">None</option>
            </select>
          </div>
          <div class="row toggleRow">
            <input type="checkbox" id="optGate" checked>
            <label for="optGate">Tier lock (linked button needs its variable first)</label>
          </div>
          <div class="row toggleRow">
            <input type="checkbox" id="optEnforceLocks">
            <label for="optEnforceLocks">Enforce tier locks (preview here; chosen again at export)</label>
          </div>
          <div class="row toggleRow">
            <input type="checkbox" id="optMassClose">
            <label for="optMassClose">"Close All" tile (always last in grid)</label>
          </div>
          <div class="buttonsRow">
            <button id="addButton" class="primary">Add Button</button>
            <button id="cancelEdit" class="hidden">Cancel</button>
            <button id="exportSelf">Export New Launcher</button>
          </div>
        </div>
        <div id="builderPreview">
          <h2>Preview</h2>
        </div>
      </div>
    </div>
  </div>
</template>
<!-- Live UI mounts here (clone of staticDOM) -->
<div id="mount"></div>
<script id="launcherCode">
"use strict";
// =========================================================
// BOOT — clone the static DOM template into the live mount.
// Everything below only ever touches the CLONE. The template
// stays pristine and is the sole export source for markup.
// =========================================================
(() => {
  const tpl = document.getElementById("staticDOM");
  document.getElementById("mount").appendChild(tpl.content.cloneNode(true));
})();
// =========================================================
// CONFIG (json64) — decode once at boot, encode on export.
// UTF-8-safe via TextEncoder/TextDecoder (the old
// unescape/escape trick is deprecated).
// =========================================================
const b64encode = (str) => {
  const bytes = new TextEncoder().encode(str);
  let bin = "";
  for (const byte of bytes) bin += String.fromCharCode(byte);
  return btoa(bin);
};
const b64decode = (str) => {
  const bytes = Uint8Array.from(atob(str), (c) => c.charCodeAt(0));
  return new TextDecoder().decode(bytes);
};
const DEFAULT_CONFIG = { title: "", buttons: [], settings: { massClose: true, enforceLocks: true } };
const loadConfig = () => {
  const el = document.getElementById("configData");
  if (!el?.textContent.trim()) return structuredClone(DEFAULT_CONFIG);
  try {
    const cfg = JSON.parse(b64decode(el.textContent.trim()));
    return {
      title: typeof cfg.title === "string" ? cfg.title : "",
      buttons: Array.isArray(cfg.buttons) ? cfg.buttons : [],
      settings: { ...DEFAULT_CONFIG.settings, ...cfg.settings }
    };
  } catch (err) {
    console.warn("configData corrupt, falling back to defaults:", err);
    return structuredClone(DEFAULT_CONFIG);
  }
};
const config = loadConfig();
// =========================================================
// RUNTIME WORKFLOW STATE (never exported — resets each run)
// =========================================================
// null-prototype maps: user-chosen labels can never collide with
// Object.prototype keys ("constructor", "__proto__", …)
let varValues = Object.create(null);  // shared variable values, keyed by master label
let localVals = Object.create(null);  // per-tile values for tiles with no shared variable
let openedSteps = new Set();          // button indices opened so far
let currentStep = -1;                 // last opened step (its star jumps)
const resetWorkflow = () => {
  varValues = Object.create(null);
  localVals = Object.create(null);
  openedSteps = new Set();
  currentStep = -1;
};
// Which variable does this button read? Masters read their own label.
const varNameFor = (btn) => (btn.isMaster ? btn.label : (btn.usesVar || ""));
// Current value for a tile: shared variable if linked, else its own
const valueFor = (btn, index) => {
  const name = varNameFor(btn);
  return name ? (varValues[name] || "") : (localVals[index] || "");
};

    const proceed = confirm(
      "Heads up: this URL contains {{var}} but Variable Handling is set " +
      "to 'Copy to clipboard'.\n\nThe {{var}} placeholder will be removed " +
      "from the URL and the value copied instead.\n\n" +
      "OK = keep clipboard mode · Cancel = go back and fix"
    );
    if (!proceed) return;
  }
  const entry = {
    label,
    desc,
    url,
    mode,
    varAction,
    isMaster,
    usesVar,
    gate: document.getElementById("optGate").checked
  };
  if (editIndex >= 0) {
    const old = config.buttons[editIndex];
    // Renaming a master relinks every dependent button to the new name
    if (old.isMaster && isMaster && old.label !== label) {
      for (const b of config.buttons) {
        if (b.usesVar === old.label) b.usesVar = label;
      }
    }
    config.buttons[editIndex] = entry;
    scrubLinks();
    resetWorkflow();
    exitEditMode();
  } else {
    config.buttons.push(entry);
    clearBuilderForm();
  }
  refreshVarSelect();
  renderLauncher();
  renderProgress();
  renderBuilderPreview();
});
document.getElementById("cancelEdit").addEventListener("click", () => {
  exitEditMode();
  renderBuilderPreview();
});
// Master and "uses variable" are mutually exclusive per button
const masterToggle = document.getElementById("optMaster");
masterToggle.addEventListener("change", () => {
  const sel = document.getElementById("btnUsesVar");
  sel.disabled = masterToggle.checked;
  if (masterToggle.checked) sel.value = "";
});
const massCloseToggle = document.getElementById("optMassClose");
massCloseToggle.checked = Boolean(config.settings.massClose);
massCloseToggle.addEventListener("change", () => {
  config.settings.massClose = massCloseToggle.checked;
  renderLauncher();
});
const enforceLocksToggle = document.getElementById("optEnforceLocks");
enforceLocksToggle.checked = Boolean(config.settings.enforceLocks);
enforceLocksToggle.addEventListener("change", () => {
  config.settings.enforceLocks = enforceLocksToggle.checked;
  renderLauncher();
});
// Dropping on empty preview space (below the items) = move to the end
const previewEl = document.getElementById("builderPreview");
previewEl.addEventListener("dragover", (e) => {
  if (dragIndex >= 0) e.preventDefault();
});
previewEl.addEventListener("drop", (e) => {
  e.preventDefault();
  if (dragIndex < 0) return;
  const from = dragIndex;
  dragIndex = -1;
  moveButtonTo(from, config.buttons.length);
});
} // end builder-only wiring
// =========================================================
// EXPORTER — reconstructs the document from STATIC sources
// only: the CSS text, the inert template markup, this script
// tag's own source text, and freshly encoded json64 config.
// Zero reads of the live/rendered DOM. Exports re-export
// cleanly forever (same structure, same ids).
// =========================================================
const exportLauncher = () => {
  const suggested = config.title || "Custom Launcher";
  let title = prompt("Title for the exported launcher:", suggested);
  if (title === null) return; // user cancelled export
  title = title.trim() || suggested;
  config.title = title;       // rides in json64, default for next export
  // Locked build (trainees) or unlocked build (trusted analysts)?
  const enforce = confirm(
    "Enforce tier locks in this export?\n\n" +
    "OK = LOCKED — steps gate until their variable is entered (trainees)\n" +
    "Cancel = UNLOCKED — no gating, full freedom (trusted analysts)"
  );
  // Ship the builder, or seal it? A sealed export contains no
  // builder DOM at all — locks can't be toggled off or re-exported
  // away, because the machinery simply isn't in the file.
  const includeBuilder = confirm(
    "Include the Builder in this export?\n\n" +
    "OK = FULL — launcher + builder (editable, self-replicating)\n" +
    "Cancel = SEALED — launcher only (settings are permanent)"
  );
  const css = document.getElementById("appStyles").textContent;
  const js = document.getElementById("launcherCode").textContent;
  const tplEl = document.getElementById("staticDOM");
  let staticHTML;
  if (includeBuilder) {
    staticHTML = tplEl.innerHTML;
  } else {
    // Mutate a CLONE of the static template — never the template
    const frag = tplEl.content.cloneNode(true);
    frag.querySelector("#builderView")?.remove();
    frag.querySelector("#modeTabs")?.remove();
    const tmp = document.createElement("div");
    tmp.appendChild(frag);
    staticHTML = tmp.innerHTML;
  }
  const wasEnforced = config.settings.enforceLocks;
  config.settings.enforceLocks = enforce;
  const cfg64 = b64encode(JSON.stringify(config));
  config.settings.enforceLocks = wasEnforced; // builder session unchanged
  const safeTitle = title.replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;");
  // NOTE: the <\/script> escapes below are load-bearing — they stop
  // the HTML parser from ending THIS script tag early, both here and
  // in every re-export (this source ships verbatim in each export).
  const html = "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n"
    + "<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n"
    + `<title>${safeTitle}</title>\n`
    + `<style id="appStyles">${css}</style>\n`
    + "</head>\n<body>\n"
    + `<script id="configData" type="application/json+base64">${cfg64}<\/script>\n`
    + `<template id="staticDOM">${staticHTML}</template>\n`
    + "<div id=\"mount\"></div>\n"
    + `<script id="launcherCode">${js}<\/script>\n`
    + "</body>\n</html>\n";
  const blob = new Blob([html], { type: "text/html" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  // \p{L}\p{N}: keep letters/digits in ANY script, not just ASCII
  const fname = title.replace(/[^\p{L}\p{N}\- ]+/gu, "").trim().replace(/\s+/g, "-");
  a.download = `${fname || "launcher"}.html`;
  a.click();
  // defer revoke — revoking synchronously can abort the download
  setTimeout(() => URL.revokeObjectURL(url), 1000);
};
document.getElementById("exportSelf")?.addEventListener("click", exportLauncher);
// =========================================================
// INITIAL RENDER
// =========================================================
refreshVarSelect();
renderLauncher();
renderProgress();
renderBuilderPreview();
</script>
</body>
</html>
