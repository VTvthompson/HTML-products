<template id="staticDOM">
  <div id="stars"></div>
  <div id="app">
    <div id="modeTabs">
      <button data-mode="guide">Guide</button>
      <button data-mode="launcher" class="active">Launcher</button>
      <button data-mode="builder">Builder</button>
    </div>
    <div id="guideView" class="view">
      <h1>Guide</h1>
      <div id="guideWrap">
        <div class="guideCard">
          <h2>What This Is</h2>
          <p>A self-contained launcher for tiered workflows. Every tile opens a destination; values you type ride along into URLs or your clipboard; and the entire platform lives in one HTML file that can rebuild itself. No install, no server, no account.</p>
          <p><strong>Running it:</strong> double-click the file — it opens in your browser like any webpage. Desktop, shared drive, USB stick, fully offline: all fine. No admin rights required.</p>
        </div>
        <div class="guideCard">
          <h2>The Launcher</h2>
          <ul>
            <li>Tiles open in a new tab, or a right-half window (split-screen capable) if built that way.</li>
            <li><strong>Cyan-edged tiles are masters.</strong> The value typed there feeds every tile linked to it, live. A master's label is its variable name.</li>
            <li><strong>Dashed-border tiles are tier-locked.</strong> They stay shut until their master variable is filled — they shake if you try early.</li>
            <li><strong>Yellow-edged tiles copy the value to your clipboard</strong> instead of the URL. Paste it inside the site once it opens.</li>
            <li>Some tiles can be built with <strong>no variable input at all</strong> for plain fixed links.</li>
            <li>The star strip tracks your progress; the bouncing star is your current step. Press Enter inside any tile's input to open it from the keyboard.</li>
            <li><strong>✕ Close All</strong> closes every window this launcher opened and resets the run.</li>
            <li><strong>Stars On / Frozen / Off</strong> — freeze or hide the background if motion bothers you (migraines, vestibular disorders, concussion recovery).</li>
          </ul>
        </div>
        <div class="guideCard">
          <h2>The Builder</h2>
          <ul>
            <li><strong>Label / Description</strong> — what the tile shows. A master's label doubles as its variable name.</li>
            <li><strong>URL</strong> — the destination. Put <code>{{var}}</code> where the value should land; with no placeholder, the value is appended to the end.</li>
            <li><strong>Open Mode</strong> — new tab, or a half-screen window for split-screen work.</li>
            <li><strong>Variable Handling</strong> — choose no variable input, insert into the URL, or copy to clipboard on open (yellow tile).</li>
            <li><strong>Master variable</strong> — makes this tile the source its linked tiles read from. <strong>Uses Master Variable</strong> links a tile to a master.</li>
            <li>As many masters as you like — each feeds its own linked tiles. But <strong>one variable per tile</strong>: a tile reads its master or its own input; there's no multi-variable templating.</li>
            <li><strong>Tier lock</strong> — the linked tile stays locked until its variable exists. <strong>Enforce tier locks</strong> previews enforcement here; the real decision is asked again at export.</li>
            <li>Everything you add shows up in the <strong>Preview</strong> panel on the right — that's also where you reorder, edit, and delete (next card).</li>
          </ul>
        </div>
        <div class="guideCard">
          <h2>The Preview — Reordering &amp; Editing</h2>
          <p>Every button you add appears as a card in the Preview panel. <strong>Tile order is workflow order</strong> — the star sequence and tier locks follow it exactly.</p>
          <ul>
            <li><strong>Drag to reorder:</strong> grab any card and drag it up or down. A cyan bar marks the landing spot — bar on a card's top edge means yours goes <em>before</em> it, bottom edge means <em>after</em>. Drop on the empty space below the list to send it to the end.</li>
            <li><strong>▲ ▼ arrows</strong> nudge a card one slot at a time — same result, keyboard friendly.</li>
            <li><strong>✎ Edit</strong> loads that button back into the form. The card glows yellow and the form button becomes <strong>Save Changes</strong>. Cancel backs out without touching anything.</li>
            <li><strong>✕ Delete</strong> removes the button instantly. Tiles linked to a deleted master unlink automatically.</li>
            <li>Reordering, editing, or deleting resets run progress — the sequence changed, so the stars start over.</li>
          </ul>
        </div>
        <div class="guideCard">
          <h2>URL Combining — Jump Straight to Records</h2>
          <p>The core trick. Most databases carry the search term or record ID in the URL. Find that URL once, swap the ID for <code>{{var}}</code>, and every analyst after you lands directly on the record — no landing page, no search box, no clicks.</p>
          <div class="guideExample">

  return names;
};
const scrubLinks = () => {
  const names = masterNameSet();
  for (const b of config.buttons) {
    if (b.usesVar && !names.has(b.usesVar)) b.usesVar = "";
  }
};
const clearBuilderForm = () => {
  if (!document.getElementById("builderPanel")) return;
  document.getElementById("btnLabel").value = "";
  document.getElementById("btnDesc").value = "";
  document.getElementById("btnURL").value = "";
  document.getElementById("btnMode").value = "tab";
  document.getElementById("btnVarAction").value = "none";
  document.getElementById("optGate").checked = true;
  document.getElementById("optMaster").checked = false;
  const sel = document.getElementById("btnUsesVar");
  sel.value = "";
  sel.disabled = false;
};
const exitEditMode = () => {
  editIndex = -1;
  if (!document.getElementById("builderPanel")) return;
  clearBuilderForm();
  document.getElementById("addButton").textContent = "Add Button";
  document.getElementById("cancelEdit").classList.add("hidden");
};
const startEdit = (index) => {
  if (!document.getElementById("builderPanel")) return;
  const b = config.buttons[index];
  editIndex = index;
  refreshVarSelect();
  document.getElementById("btnLabel").value = b.label || "";
  document.getElementById("btnDesc").value = b.desc || "";
  document.getElementById("btnURL").value = b.url || "";
  document.getElementById("btnMode").value = b.mode || "tab";
  document.getElementById("btnVarAction").value = b.varAction || "none";
  document.getElementById("optGate").checked = b.gate !== false;
  const m = document.getElementById("optMaster");
  const sel = document.getElementById("btnUsesVar");
  m.checked = Boolean(b.isMaster);
  sel.disabled = Boolean(b.isMaster);
  sel.value = b.usesVar || "";
  document.getElementById("addButton").textContent = "Save Changes";
  document.getElementById("cancelEdit").classList.remove("hidden");
  renderBuilderPreview();
};
const moveButton = (index, dir) => {
  const target = index + dir;
  if (target < 0 || target >= config.buttons.length) return;
  if (editIndex >= 0) exitEditMode();
  [config.buttons[index], config.buttons[target]] = [config.buttons[target], config.buttons[index]];
  resetWorkflow();
  renderLauncher();
  renderProgress();
  renderBuilderPreview();
};
const moveButtonTo = (from, to) => {
  if (from < 0 || from >= config.buttons.length) return;
  const target = to > from ? to - 1 : to;
  if (target === from) return;
  if (editIndex >= 0) exitEditMode();
  const [item] = config.buttons.splice(from, 1);
  config.buttons.splice(target, 0, item);
  resetWorkflow();
  renderLauncher();
  renderProgress();
  renderBuilderPreview();
};
const deleteButton = (index) => {
  config.buttons.splice(index, 1);
  scrubLinks();
  if (editIndex >= 0) exitEditMode();
  resetWorkflow();
  refreshVarSelect();
  renderLauncher();
  renderProgress();
  renderBuilderPreview();
};
const refreshVarSelect = () => {
  const sel = document.getElementById("btnUsesVar");
  if (!sel) return;
  const prev = sel.value;
  sel.replaceChildren();
  const none = document.createElement("option");
  none.value = "";
  none.textContent = "None";
  sel.appendChild(none);
  for (const name of masterNameSet()) {
    const o = document.createElement("option");
    o.value = name;
    o.textContent = name;
    sel.appendChild(o);
  }
  sel.value = prev;
  if (sel.value !== prev) sel.value = "";
};
const renderBuilderPreview = () => {
  const preview = document.getElementById("builderPreview");
  if (!preview) return;
  preview.replaceChildren();
  const previewTitle = document.createElement("h2");
  previewTitle.textContent = "Preview";
  preview.appendChild(previewTitle);
  if (!config.buttons.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "No buttons yet. Add one on the left.";
    preview.appendChild(empty);
    return;
  }
  config.buttons.forEach((btn, index) => {
    const box = document.createElement("div");
    box.className = "buttonBox builderPreviewItem";
    box.style.position = "relative";
    const title = document.createElement("div");
    title.className = "buttonTitle";
    title.textContent = btn.label || "";
    const desc = document.createElement("div");
    desc.className = "buttonDesc";
    desc.textContent = btn.desc || "";
    let badge = null;
    if (btn.isMaster) {
      badge = document.createElement("div");
      badge.className = "previewBadge";
      badge.textContent = `★ master: ${btn.label}`;
    } else if (btn.usesVar) {
      badge = document.createElement("div");
      badge.className = "previewBadge linked";
      badge.textContent = `⛓ uses: ${btn.usesVar}${btn.gate !== false ? " 🔒" : " · no lock"}`;
    }
    let copyBadge = null;
    if ((btn.varAction || "none") === "copy") {
      copyBadge = document.createElement("div");
      copyBadge.className = "previewBadge copy";
      copyBadge.textContent = "📋 clipboard";
    }
    let noneBadge = null;
    if ((btn.varAction || "none") === "none" && !btn.isMaster && !btn.usesVar) {
      noneBadge = document.createElement("div");
      noneBadge.className = "previewBadge";
      noneBadge.textContent = "🔗 fixed link";
    }
    const controls = document.createElement("div");
    controls.className = "pvControls";
    const pvBtn = (cls, glyph, label, onClick, isDisabled = false) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = `pvBtn${isDisabled ? " disabled" : ""}${cls ? ` ${cls}` : ""}`;
      b.textContent = glyph;
      b.title = label;
      b.setAttribute("aria-label", label);
      b.disabled = isDisabled;
      b.addEventListener("click", onClick);
      return b;
    };
    const up = pvBtn("", "▲", "Move up", () => moveButton(index, -1), index === 0);
    const down = pvBtn("", "▼", "Move down", () => moveButton(index, 1), index === config.buttons.length - 1);
    const edit = pvBtn("", "✎", "Edit", () => startEdit(index));
    const del = pvBtn("danger", "✕", "Delete", () => deleteButton(index));
    controls.append(up, down, edit, del);
    if (index === editIndex) box.classList.add("editing");
    box.append(title, desc);
    if (badge) box.appendChild(badge);
    if (copyBadge) box.appendChild(copyBadge);
    if (noneBadge) box.appendChild(noneBadge);
    box.appendChild(controls);
    box.draggable = true;
    box.addEventListener("dragstart", (e) => {
      dragIndex = index;
      box.classList.add("dragging");
      try {
        e.dataTransfer.setData("text/plain", String(index));
        e.dataTransfer.effectAllowed = "move";
      } catch {}
    });
    box.addEventListener("dragend", () => {
      dragIndex = -1;
      preview.querySelectorAll(".builderPreviewItem").forEach((el) => {
        el.classList.remove("dragging", "dropBefore", "dropAfter");
      });
    });
    box.addEventListener("dragover", (e) => {
      if (dragIndex < 0 || index === dragIndex) return;
      e.preventDefault();
      const before = (e.offsetY || 0) < (box.offsetHeight || 0) / 2;
      box.classList.toggle("dropBefore", before);
      box.classList.toggle("dropAfter", !before);
    });
    box.addEventListener("dragleave", () => {
      box.classList.remove("dropBefore", "dropAfter");
    });
    box.addEventListener("drop", (e) => {
      e.preventDefault();
      e.stopPropagation();
      if (dragIndex < 0 || index === dragIndex) return;
      const before = box.classList.contains("dropBefore");
      const from = dragIndex;
      dragIndex = -1;
      moveButtonTo(from, index + (before ? 0 : 1));
    });
    preview.appendChild(box);
  });
};
if (document.getElementById("builderPanel")) {
  document.getElementById("addButton").addEventListener("click", () => {
    const label = document.getElementById("btnLabel").value.trim();
    const desc = document.getElementById("btnDesc").value.trim();
    const url = document.getElementById("btnURL").value.trim();
    const mode = document.getElementById("btnMode").value;
    const varAction = document.getElementById("btnVarAction").value;
    const isMaster = document.getElementById("optMaster").checked;
    const usesVar = isMaster ? "" : document.getElementById("btnUsesVar").value;
    if (!label || !url) {
      alert("Label and URL are required.");
      return;
    }
    if (varAction === "copy" && url.includes("{{var}}")) {
      const proceed = confirm(
        "Heads up: this URL contains {{var}} but Variable Handling is set " +
        "to 'Copy to clipboard'.\n\nThe {{var}} placeholder will be removed " +
        "from the URL and the value copied instead.\n\n" +
        "OK = keep clipboard mode · Cancel = go back and fix"
      );
      if (!proceed) return;
    }
    const entry = {
      label,
      desc,
      url,
      mode,
      varAction,
      isMaster,
      usesVar,
      gate: document.getElementById("optGate").checked
    };
    if (editIndex >= 0) {
      const old = config.buttons[editIndex];
      if (old.isMaster && isMaster && old.label !== label) {
        for (const b of config.buttons) {
          if (b.usesVar === old.label) b.usesVar = label;
        }
      }
      config.buttons[editIndex] = entry;
      scrubLinks();
      resetWorkflow();
      exitEditMode();
    } else {
      config.buttons.push(entry);
      clearBuilderForm();
    }
    refreshVarSelect();
    renderLauncher();
    renderProgress();
    renderBuilderPreview();
  });
  document.getElementById("cancelEdit").addEventListener("click", () => {
    exitEditMode();
    renderBuilderPreview();
  });
  const masterToggle = document.getElementById("optMaster");
  masterToggle.addEventListener("change", () => {
    const sel = document.getElementById("btnUsesVar");
    sel.disabled = masterToggle.checked;
    if (masterToggle.checked) sel.value = "";
  });
  const massCloseToggle = document.getElementById("optMassClose");
  massCloseToggle.checked = Boolean(config.settings.massClose);
  massCloseToggle.addEventListener("change", () => {
    config.settings.massClose = massCloseToggle.checked;
    renderLauncher();
  });
  const enforceLocksToggle = document.getElementById("optEnforceLocks");
  enforceLocksToggle.checked = Boolean(config.settings.enforceLocks);
  enforceLocksToggle.addEventListener("change", () => {
    config.settings.enforceLocks = enforceLocksToggle.checked;
    renderLauncher();
  });
  const previewEl = document.getElementById("builderPreview");
  previewEl.addEventListener("dragover", (e) => {
    if (dragIndex >= 0) e.preventDefault();
  });
  previewEl.addEventListener("drop", (e) => {
    e.preventDefault();
    if (dragIndex < 0) return;
    const from = dragIndex;
    dragIndex = -1;
    moveButtonTo(from, config.buttons.length);
  });
}
const exportLauncher = () => {
  const suggested = config.title || "Custom Launcher";
  let title = prompt("Title for the exported launcher:", suggested);
  if (title === null) return;
  title = title.trim() || suggested;
  config.title = title;
  const enforce = confirm(
    "Enforce tier locks in this export?\n\n" +
    "OK = LOCKED — steps gate until their variable is entered (trainees)\n" +
    "Cancel = UNLOCKED — no gating, full freedom (trusted analysts)"
  );
  const includeBuilder = confirm(
    "Include the Builder in this export?\n\n" +
    "OK = FULL — launcher + builder (editable, self-replicating)\n" +
    "Cancel = SEALED — launcher only (settings are permanent)"
  );
  const css = document.getElementById("appStyles").textContent;
  const js = document.getElementById("launcherCode").textContent;
  const tplEl = document.getElementById("staticDOM");
  let staticHTML;
  if (includeBuilder) {
    staticHTML = tplEl.innerHTML;
  } else {
    const frag = tplEl.content.cloneNode(true);
    frag.querySelector("#builderView")?.remove();
    frag.querySelector('#modeTabs [data-mode="builder"]')?.remove();
    const tmp = document.createElement("div");
    tmp.appendChild(frag);
    staticHTML = tmp.innerHTML;
  }
  const wasEnforced = config.settings.enforceLocks;
  config.settings.enforceLocks = enforce;
  const cfg64 = b64encode(JSON.stringify(config));
  config.settings.enforceLocks = wasEnforced;
  const safeTitle = title.replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;");
  const html = "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n"
    + "<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n"
    + `<title>${safeTitle}</title>\n`
    + `<style id="appStyles">${css}</style>\n`
    + "</head>\n<body>\n"
    + `<script id="configData" type="application/json+base64">${cfg64}<\/script>\n`
    + `<template id="staticDOM">${staticHTML}</template>\n`
    + "<div id=\"mount\"></div>\n"
    + `<script id="launcherCode">${js}<\/script>\n`
    + "</body>\n</html>\n";
  const blob = new Blob([html], { type: "text/html" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  const fname = title.replace(/[^\p{L}\p{N}\- ]+/gu, "").trim().replace(/\s+/g, "-");
  a.download = `${fname || "launcher"}.html`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
};
document.getElementById("exportSelf")?.addEventListener("click", exportLauncher);
refreshVarSelect();
renderLauncher();
renderProgress();
renderBuilderPreview();
</script>
</body>
</html>
